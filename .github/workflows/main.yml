name: FunLearn AI — Professional DevOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── JOB 1: Tests ─────────────────────────────────────────────
  test-suite:
    name: Run Tests (Backend & Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Python Setup & Check
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          cd backend
          pip install -r requirements.txt
          python manage.py check

      - name: Node Setup & Build Check
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
        env:
          CI: false
          REACT_APP_API_URL: https://funlearn-o3b9.onrender.com/api

  # ── JOB 2: Docker Verification ───────────────────────────────
  docker-build:
    name: Docker Build & Verify
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Images
        run: |
          docker build -t funlearn-backend:latest ./backend
          docker build -t funlearn-frontend:latest ./frontend

  # ── JOB 3: Deploy Backend (Render) ───────────────────────────
  deploy-backend:
    name: Deploy to Render
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Hook
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

 # ── JOB 4: Deploy Frontend (Vercel) ──────────────────────────
  deploy-frontend:
    name: Deploy to Vercel
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Vercel Deploy
        run: |
          cd frontend
          # Yahan '--org' ko badal kar '--scope' kar diya hai
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
