name: FunLearn AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Test Django Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Updated to v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test environment
        run: |
          cd backend
          echo "DJANGO_SECRET_KEY=test-ci-secret-key-not-real" > .env
          echo "DJANGO_DEBUG=True" >> .env
          echo "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
          echo "MONGODB_URI=mongodb://localhost:27017/" >> .env
          echo "MONGODB_DB_NAME=funlearn_test" >> .env
          echo "JWT_ACCESS_TOKEN_LIFETIME_MINUTES=60" >> .env
          echo "JWT_REFRESH_TOKEN_LIFETIME_DAYS=7" >> .env
          echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> .env

      - name: Django system check
        run: |
          cd backend
          python manage.py check

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate

  test-frontend:
    name: Test React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4 # Updated to v4
        with:
          node-version: '18'

      - name: Install npm packages
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build React app
        run: |
          cd frontend
          npm run build
        env:
          CI: false

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3 # Updated to v3

      - name: Build backend Docker image
        run: |
          cd backend
          echo "DJANGO_SECRET_KEY=test-key" > .env
          echo "MONGODB_URI=mongodb://localhost:27017/" >> .env
          echo "MONGODB_DB_NAME=funlearn_db" >> .env
          docker build -t funlearn-backend:latest .

      - name: Build frontend Docker image
        run: |
          docker build -t funlearn-frontend:latest ./frontend
